[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-vision-openai"
version = "0.1.0"
description = "为纯文本模型提供图片理解能力，通过 MCP 协议调用 OpenAI 兼容的视觉模型 API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "MLTZ" },
]
keywords = ["mcp", "vision", "openai", "image-analysis", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.28.0",
]

[project.scripts]
mcp-vision-openai = "mcp_vision_openai.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_vision_openai"]
